# Tag a version (git tag v0.1.0 && git push origin v0.1.0) and the desktop app is built
# for macOS (Apple Silicon DMG) and Linux (AppImage) and attached to a GitHub release.
# The desktop app's updater (desktop/updater.cjs) reads the latest release, so keep the asset names as built.
name: Release

on:
  push:
    tags: ['v*']

# Creating the release and uploading its files needs write access to the repo's contents.
permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        # Ubuntu pinned: an AppImage runs only on systems with at least the glibc it was built against, so the
        # oldest supported runner reaches the most Linux installs. ubuntu-latest moves to newer releases on its own.
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Node and bun as pinned in mise.toml, like ci.yml.
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run test
      - run: bun run build
      # Apple Silicon only (macos-latest is arm64, so bun install fetched arm64 native modules), with its ffmpeg in
      # vendor/ffmpeg (scripts/ffmpeg-dmg.sh).
      - if: runner.os == 'macOS'
        run: |
          sh scripts/ffmpeg-dmg.sh
          bunx electron-builder --mac dmg --arm64 --publish never
      - if: runner.os == 'Linux'
        run: bunx electron-builder --linux --publish never
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.dmg
            release/*.AppImage
          generate_release_notes: true
