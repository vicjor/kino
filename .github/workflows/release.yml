# Tag a version (git tag v0.1.0 && git push origin v0.1.0) and the desktop app is built
# for macOS (arm64 + x64 DMG) and Linux (AppImage) and attached to a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

# Creating the release and uploading its files needs write access to the repo's contents.
permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        # Ubuntu pinned: an AppImage runs only on systems with at least the glibc it was built against, so the
        # oldest supported runner reaches the most Linux installs. ubuntu-latest moves to newer releases on its own.
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Node and bun as pinned in mise.toml, like ci.yml.
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run test
      - run: bun run build
      # One arch per electron-builder run, each after fetching that CPU's ffmpeg into vendor/ffmpeg
      # (scripts/ffmpeg-arch.sh) and its node-datachannel binary (scripts/native-arch.sh). The `dmg` target makes electron-builder build just the arch given, not every arch in mac.target.
      - if: runner.os == 'macOS'
        run: |
          for arch in arm64 x64; do
            sh scripts/ffmpeg-arch.sh "$arch"
            sh scripts/native-arch.sh "$arch"
            bunx electron-builder --mac dmg --"$arch" --publish never
          done
      - if: runner.os == 'Linux'
        run: bunx electron-builder --linux --publish never
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.dmg
            release/*.AppImage
          generate_release_notes: true
