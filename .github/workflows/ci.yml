name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Linux too: the release builds the AppImage there and runs the tests first.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Not `bun run build`: build:check also runs scripts/verify-build.ts (entry chunk size, sw.js pre-cache).
      - run: bun run build:check
      - run: bun run knip
      # Fails only on advisories without an Accepted row in docs/security-advisories.md.
      - run: bun run audit:gate
